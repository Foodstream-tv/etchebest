services:
  nginx:
    image: nginx:alpine
    container_name: nginx-https
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./ssl:/etc/nginx/ssl:ro
    network_mode: "host"
    depends_on:
      - frontend
      - backend
      - analytics

  postgres:
    image: postgres:16-alpine
    container_name: db-foodstream
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}'
    networks:
      - back-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost" ]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    container_name: backend-foodstream
    depends_on:
      postgres:
        condition: service_healthy
    build: ./backend
    env_file: ./.env
    network_mode: "host"
    environment:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_PORT: ${BACKEND_PORT}
      STUN_SERVER_URL: ${STUN_SERVER_URL}
      WEBRTC_IP: ${WEBRTC_IP:-127.0.0.1}
      WEBRTC_PORT_MIN: ${WEBRTC_PORT_MIN:-50000}
      WEBRTC_PORT_MAX: ${WEBRTC_PORT_MAX:-50100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DEV_MODE: ${DEV_MODE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-https://foodstream.tv}


  frontend:
    container_name: frontend-foodstream
    depends_on:
      - backend
    build:
      context: ./front-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${VM_IP}/api
    network_mode: "host"
    restart: unless-stopped

  analytics:
    container_name: analytics-foodstream
    build:
      context: ./analytics
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${VM_IP}
    network_mode: "host"
    environment:
      - PORT=3001
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  back-network:
    driver: bridge
