# Weekly version updates, grouped per project: one PR for minor/patch updates, one for major ones.
# Minor/patch groups are merged automatically once CI is green (dependabot-auto-merge.yml); majors stay manual.
# Security updates keep coming as soon as an alert appears.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
      go-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: npm
    directory: /front-web
    schedule:
      interval: weekly
    ignore:
      # Types of the Node version the app runs on (22): no newer major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet, and eslint-config-next / eslint-plugin-react do
      # not load under ESLint 10 yet: both break lint. Lift these once those packages support them.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
      web-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: npm
    directory: /analytics
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Same reasons as the web app: typescript-eslint has no TypeScript 7, eslint-config-next no ESLint 10.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      analytics:
        patterns: ["*"]
        update-types: [minor, patch]
      analytics-major:
        patterns: ["*"]
        update-types: [major]

  # Expo, React, React Native and what the SDK pins (TypeScript, Jest) move together with the SDK
  # (npx expo install expo@^NN --fix), never one by one.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # babel-preset-expo is built on Babel 7: Babel 8 moves with the Expo SDK.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # v14 makes render() asynchronous: every test (60 files) must be migrated at once, not by a bump.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
    groups:
      mobile:
        patterns: ["*"]
        update-types: [minor, patch]
      mobile-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
