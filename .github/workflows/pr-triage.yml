name: PR triage

# Labels from the changed files, and the author assigned to their own PR.
# pull_request_target: it also works for PRs from forks, and never checks out or runs the PR's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    name: Labels and assignee
    runs-on: ubuntu-latest
    steps:
      - name: Labels from the changed files
        uses: actions/labeler@v7
        with:
          sync-labels: true

      - name: Assign the author
        if: github.event.action == 'opened' && github.event.pull_request.user.type != 'Bot' && toJSON(github.event.pull_request.assignees) == '[]'
        run: gh api -X POST "repos/$REPO/issues/$NUMBER/assignees" -f "assignees[]=$AUTHOR" --silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
