name: CI - Build & Test

on:
  push:
    branches: [main, dev, feature/*]
  # Every pull request, whatever its base branch (stacked PRs included).
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A new push to the same branch/PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, vet, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Throwaway Postgres for the tests that exercise real SQL (account erasure and export).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.2
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      # Fails when go.mod / go.sum are not tidy, instead of silently rewriting them in CI.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race catches the unsynchronised access to shared room state that crashes the whole server.
      - name: Test (race detector)
        run: go test -race ./...

      # backend/docs is generated from the handlers' comments: a route added without regenerating it fails here.
      - name: Swagger is up to date
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/server/main.go -o docs --quiet
          git diff --exit-code -- docs || {
            echo "::error::backend/docs is stale. Run in backend/: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/server/main.go -o docs"
            exit 1
          }
        env:
          TEST_DATABASE_DSN: host=localhost port=5432 user=postgres password=test dbname=test sslmode=disable

  mobile:
    name: Mobile (types, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "true"
      # tsc on the Expo/React Native types needs more than Node's default heap.
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Unit tests
        run: npx jest --ci

      # Every Expo package at the version of the SDK in use, no duplicated native module.
      - name: Expo dependencies match the SDK
        run: npx expo install --check

      - name: Expo doctor
        run: npx expo-doctor@1.20.4

  web:
    name: Web (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-web
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # The build also renders the static pages: it catches what tsc and the lint do not (server rendering, routes).
      - name: Build
        run: npm run build

  analytics:
    name: Analytics (types, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analytics

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  scripts:
    name: Dev scripts (dev-setup, seed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: dev-setup.sh
        run: ./scripts/test-dev-setup.sh

      - name: seed.sh
        run: ./scripts/test-seed.sh
