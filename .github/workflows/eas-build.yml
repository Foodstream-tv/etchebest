name: EAS build

# Mobile builds on Expo's servers (no Mac needed for iOS): by hand from the Actions tab, and an Android
# preview build for every release (release-please.yml). The build is queued and the job ends right away:
# follow it, and download the result, on expo.dev.
#
# Needs the EXPO_TOKEN secret (expo.dev → Account settings → Access tokens). Without it, nothing happens.
# iOS builds also need the Apple credentials set up once in EAS (npx eas credentials).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profil de eas.json
        type: choice
        options: [preview, development, production]
        default: preview
      platform:
        description: Plateforme
        type: choice
        options: [android, ios, all]
        default: android
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      platform:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Skip without EXPO_TOKEN
        if: env.EXPO_TOKEN == ''
        working-directory: .
        run: 'echo "::notice::EXPO_TOKEN is not set: no EAS build (see the comment at the top of eas-build.yml)."'

      - uses: actions/checkout@v4
        if: env.EXPO_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: env.EXPO_TOKEN != ''
        run: npm ci

      - name: Queue the build
        if: env.EXPO_TOKEN != ''
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --non-interactive --no-wait
        env:
          PROFILE: ${{ inputs.profile }}
          PLATFORM: ${{ inputs.platform }}
