services:
  postgres:
    image: postgres:16-alpine
    container_name: db-foodstream
    restart: unless-stopped
    env_file: .env
    ports:
      - '${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}'
    networks:
      - back-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-foodstream} -h localhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    container_name: backend-foodstream
    depends_on:
      postgres:
        condition: service_healthy
    build: ./backend
    env_file: ./.env
    ports:
      - '${BACKEND_PORT:-8081}:${BACKEND_PORT:-8081}'
      - '${WEBRTC_PORT_MIN:-50000}-${WEBRTC_PORT_MAX:-50100}:${WEBRTC_PORT_MIN:-50000}-${WEBRTC_PORT_MAX:-50100}/udp'
    networks:
      - back-network
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-foodstream}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_PORT: ${BACKEND_PORT:-8081}
      STUN_SERVER_URL: ${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
      WEBRTC_IP: ${WEBRTC_IP:-127.0.0.1}
      WEBRTC_PORT_MIN: ${WEBRTC_PORT_MIN:-50000}
      WEBRTC_PORT_MAX: ${WEBRTC_PORT_MAX:-50100}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/api/auth/google/callback}
      DEV_MODE: ${DEV_MODE:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-http://localhost:3000}


  frontend:
    container_name: frontend-foodstream
    depends_on:
      - backend
    build:
      context: ./front-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8081/api
    ports:
      - '3000:3000'
    networks:
      - back-network
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8081

  analytics:
    container_name: analytics-foodstream
    depends_on:
      - backend
    build:
      context: ./analytics
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - '3001:3000'
    networks:
      - back-network
    restart: unless-stopped


volumes:
  postgres_data:
    driver: local

networks:
  back-network:
    driver: bridge
